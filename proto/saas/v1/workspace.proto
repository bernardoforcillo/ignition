syntax = "proto3";

// WorkspaceService manages the tenant: workspaces, their members and
// invitations. Every RPC needs an access token; the caller is the token's
// subject.
package saas.v1;

option go_package = "github.com/bernardoforcillo/ignition/go-packages/proto/gen/saas/v1;saasv1";

service WorkspaceService {
  // ChangeMemberRole sets a member's role. Needs the member:update permission
  // and the privilege-escalation guard: nobody can grant more than they hold.
  // The last owner cannot be demoted.
  rpc ChangeMemberRole(ChangeMemberRoleRequest) returns (ChangeMemberRoleResponse);

  // RemoveMember removes a member from the workspace (member:delete, with the
  // same guard). The last owner cannot be removed.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // ListInvitations lists the workspace's pending invitations (invite:read).
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);

  // RevokeInvitation cancels a pending invitation (invite:delete).
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);

  // ListWorkspaces returns the workspaces the caller belongs to, with the
  // caller's role in each. The web uses it to decide between onboarding (no
  // workspace yet) and the app, and to fill the workspace switcher.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);

  // CreateWorkspace makes a workspace owned by the caller.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // GetWorkspace returns a workspace the caller belongs to.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  // ListMembers lists the members of a workspace the caller belongs to.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // InviteMember mails an invitation to join the workspace at a role.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  // AcceptInvite joins the caller to the workspace named by an invitation token.
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
}

message Workspace {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message Member {
  string user_id = 1;
  // role_key is "owner", "admin", "member" or a custom role key.
  string role_key = 2;
  // email of the member's account, empty when it cannot be resolved.
  string email = 3;
}

message Invitation {
  string id = 1;
  string email = 2;
  string role_key = 3;
}

message CreateWorkspaceRequest {
  string name = 1;
  // slug is optional; it is derived from the name when empty.
  string slug = 2;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListMembersRequest {
  string workspace_id = 1;
}

message ListMembersResponse {
  repeated Member members = 1;
}

message InviteMemberRequest {
  string workspace_id = 1;
  string email = 2;
  string role_key = 3;
}

message InviteMemberResponse {
  Invitation invitation = 1;
}

message AcceptInviteRequest {
  string token = 1;
}

message AcceptInviteResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {}

message WorkspaceMembership {
  Workspace workspace = 1;
  string role_key = 2;
}

message ListWorkspacesResponse {
  repeated WorkspaceMembership workspaces = 1;
}

message ChangeMemberRoleRequest {
  string workspace_id = 1;
  string user_id = 2;
  string role_key = 3;
}

message ChangeMemberRoleResponse {}

message RemoveMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message ListInvitationsRequest {
  string workspace_id = 1;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message RevokeInvitationRequest {
  string workspace_id = 1;
  string invitation_id = 2;
}

message RevokeInvitationResponse {}
