syntax = "proto3";

// AuthService is the public sign-up / sign-in surface. Every RPC except
// Logout is callable without an access token; see
// internal/adapter/httpapi/interceptor.go for the authoritative list.
package saas.v1;

option go_package = "github.com/bernardoforcillo/ignition/go-packages/proto/gen/saas/v1;saasv1";

service AuthService {
  // SignUp registers an account and mails a verification link. It answers
  // identically whether or not the address is already registered.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  // VerifyEmail redeems the token from the verification email.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Login checks the password of a verified account and opens a session.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Refresh rotates the refresh token and mints a new access token.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Logout revokes the session behind a refresh token. Requires a valid
  // access token.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // RequestPasswordReset mails a single-use reset link when the address has
  // an account. It answers identically whether or not the address exists and
  // is rate limited per client IP and per address.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);

  // ResetPassword sets a new password from the emailed token, then revokes
  // every session of the account so a stolen session does not survive it.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // ListAuthProviders lists the external sign-in providers configured on this
  // deployment (e.g. Google) so the web shows only the buttons that work.
  // Public.
  rpc ListAuthProviders(ListAuthProvidersRequest) returns (ListAuthProvidersResponse);

  // StartOAuth begins an external sign-in: it returns the provider's
  // authorization URL (with PKCE and a server-side state record) for the web to
  // navigate the browser to, and the opaque state the web must keep (in
  // sessionStorage) and present again to ExchangeOAuthCode. Public.
  rpc StartOAuth(StartOAuthRequest) returns (StartOAuthResponse);

  // ExchangeOAuthCode redeems the single-use, short-lived code the gateway's
  // provider callback redirected the browser back with, bound to the state
  // StartOAuth returned (so a code obtained in another browser is useless), and
  // returns the same session a password login returns. The provider's tokens
  // never reach the browser. Public.
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse);
}

message User {
  string id = 1;
  string email = 2;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
}

message SignUpResponse {}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message AuthProvider {
  // id is the stable provider key, e.g. "google".
  string id = 1;
  // name is the label for the button, e.g. "Google".
  string name = 2;
}

message ListAuthProvidersRequest {}

message ListAuthProvidersResponse {
  repeated AuthProvider providers = 1;
}

message StartOAuthRequest {
  // provider is an id from ListAuthProviders.
  string provider = 1;
}

message StartOAuthResponse {
  // authorization_url is where to send the browser.
  string authorization_url = 1;
  // state must be kept by the web and sent back to ExchangeOAuthCode.
  string state = 2;
}

message ExchangeOAuthCodeRequest {
  string code = 1;
  string state = 2;
}

message ExchangeOAuthCodeResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  // created is true when this sign-in provisioned a new account (first run).
  bool created = 4;
}
