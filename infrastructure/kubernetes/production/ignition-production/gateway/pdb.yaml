apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: ignition-production
spec:
  # maxUnavailable (not minAvailable) so a node drain is never blocked when
  # an environment runs a single replica.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
