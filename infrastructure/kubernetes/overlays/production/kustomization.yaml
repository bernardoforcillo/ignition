apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: ignition-production

# Pin immutable tags (or digests) here, ideally set by CI:
#   kustomize edit set image ignition/gateway=ghcr.io/OWNER/ignition-gateway:<sha>
images:
  - name: ignition/gateway
    newName: ghcr.io/OWNER/ignition-gateway
    newTag: latest
  - name: ignition/web
    newName: ghcr.io/OWNER/ignition-web
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
