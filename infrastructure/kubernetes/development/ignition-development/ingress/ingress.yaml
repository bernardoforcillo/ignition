apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ignition
  namespace: ignition-development
spec:
  ingressClassName: nginx
  rules:
    - host: dev.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
