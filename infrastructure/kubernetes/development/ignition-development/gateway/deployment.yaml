apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ignition-development
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ignition
spec:
  # No `replicas`: the HPA in hpa.yaml owns the count; a pinned value here
  # would fight the autoscaler on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: ignition
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/OWNER/ignition-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            # Optional Secret with GATEWAY_AUTH_TOKEN (see README).
            - secretRef:
                name: gateway-secrets
                optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            # 30 x 5s = 150s to boot before anything gives up on the pod.
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
