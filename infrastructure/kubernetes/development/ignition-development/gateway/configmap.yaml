apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: ignition-development
data:
  GATEWAY_LISTEN_ADDR: ":8080"
  GATEWAY_ROUTES: "/api=http://api.ignition-development.svc.cluster.local:8080"
  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_BURST: "100"
  GATEWAY_SHUTDOWN_TIMEOUT: "10s"
  # SaaS surface (go-packages). It stays off until DATABASE_URL is provided through the
  # gateway-secrets Secret; these are the non-secret settings it needs once on.
  APP_URL: "https://dev.example.com"
  COMPANY_NAME: "Ignition"
  MAIL_FROM: "Ignition <hello@dev.example.com>"
