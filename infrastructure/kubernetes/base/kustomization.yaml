apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ignition

labels:
  - pairs:
      app.kubernetes.io/part-of: ignition
    includeSelectors: false

resources:
  - namespace.yaml
  - gateway.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: gateway-config
    literals:
      - GATEWAY_LISTEN_ADDR=:8080
      - GATEWAY_ROUTES=/api=http://api.ignition.svc.cluster.local:8080
      - RATE_LIMIT_RPS=50
      - RATE_LIMIT_BURST=100
      - GATEWAY_SHUTDOWN_TIMEOUT=10s

# Image names are placeholders; overlays pin the registry and tag.
images:
  - name: ignition/gateway
    newName: ghcr.io/OWNER/ignition-gateway
    newTag: latest
  - name: ignition/web
    newName: ghcr.io/OWNER/ignition-web
    newTag: latest
