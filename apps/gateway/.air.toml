# Air watches only this directory: after editing a sibling module under
# go-packages/ (identity, features, billing, ...), restart air to rebuild.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/gateway.exe ."
  bin = "./tmp/gateway.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
